name: Generate All ROS IP Lists from clang

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set git identity
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Combine
      run: |
        set -e

        BASE_URL="https://ispip.clang.cn"

        echo "/ip firewall address-list remove [find list=\"CNIP\"]" > cnip.rsc
        curl -fsSL --retry 3 --retry-all-errors "$BASE_URL/all_cn.txt" |
          awk '/^[^#]/ && NF {print "/ip firewall address-list add list=CNIP address=" $1}' >> cnip.rsc

        echo "/ip firewall address-list remove [find list=\"CT\"]" > ct.rsc
        curl -fsSL --retry 3 --retry-all-errors "$BASE_URL/chinatelecom.txt" |
          awk '/^[^#]/ && NF {print "/ip firewall address-list add list=CT address=" $1}' >> ct.rsc

        echo "/ip firewall address-list remove [find list=\"CU\"]" > cu.rsc
        curl -fsSL --retry 3 --retry-all-errors "$BASE_URL/unicom_cnc.txt" |
          awk '/^[^#]/ && NF {print "/ip firewall address-list add list=CU address=" $1}' >> cu.rsc

        echo "/ip firewall address-list remove [find list=\"CMCC\"]" > cmcc.rsc
        curl -fsSL --retry 3 --retry-all-errors "$BASE_URL/cmcc.txt" |
          awk '/^[^#]/ && NF {print "/ip firewall address-list add list=CMCC address=" $1}' >> cmcc.rsc

        echo "/ipv6 firewall address-list remove [find list=\"CNIP\"]" > cnip6.rsc
        curl -fsSL --retry 3 --retry-all-errors "$BASE_URL/all_cn_ipv6.txt" |
          awk '/^[^#]/ && NF {print "/ipv6 firewall address-list add list=CNIP address=" $1}' >> cnip6.rsc

    - name: Apply
      run: |
        Emoji=("🎉" "🤞" "✨" "🎁" "🎈" "🎄" "🎨" "💋" "🍓" "🍕" "🍉" "💐" "🌴" "🚀" "🛸" "🗽" "⛅" "🌈" "🔥" "⛄" "🐶" "🏅" "🦄" "🐤")

        git add cnip.rsc ct.rsc cu.rsc cmcc.rsc cnip6.rsc

        if git diff --staged --quiet; then
          echo "数据已经是最新，无需更新。"
        else
          git commit -m "${Emoji[$[$RANDOM % ${#Emoji[@]}]]} Sync $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi
